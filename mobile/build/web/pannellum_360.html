<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZA Tour 360°</title>

  <!-- Pannellum CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0F1F2E; overflow: hidden; }

    #panorama {
      width: 100%;
      height: 100%;
    }

    /* ── HUD superior ── */
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(15,31,46,0.85) 0%, transparent 100%);
      pointer-events: none;
      z-index: 10;
    }

    #scene-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #scene-icon {
      width: 36px; height: 36px;
      background: rgba(255,90,60,0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    #scene-label {
      color: white;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    #scene-sublabel {
      color: rgba(255,255,255,0.65);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 500;
    }

    #kaza-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,90,60,0.15);
      border: 1px solid rgba(255,90,60,0.5);
      border-radius: 20px;
      padding: 4px 12px;
      color: #FF5A3C;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* ── Navegación inferior ── */
    #nav-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px 20px;
      background: linear-gradient(to top, rgba(15,31,46,0.92) 0%, transparent 100%);
      z-index: 10;
      gap: 10px;
    }

    /* Thumbnails de habitaciones */
    #scene-thumbnails {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .thumb {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: all;
    }

    .thumb:hover { opacity: 1; transform: scale(1.08); }
    .thumb.active { opacity: 1; }

    .thumb-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transition: background 0.2s, width 0.2s;
    }

    .thumb.active .thumb-dot {
      background: #FF5A3C;
      width: 22px;
      border-radius: 4px;
    }

    .thumb-name {
      color: rgba(255,255,255,0.6);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 10px;
      font-weight: 600;
    }

    .thumb.active .thumb-name { color: white; }

    /* Botones prev/next */
    #nav-buttons {
      display: flex;
      gap: 12px;
      align-items: center;
      pointer-events: all;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      color: white;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 18px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.22);
      transform: scale(1.04);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .nav-btn.next-btn {
      background: rgba(255,90,60,0.85);
      border-color: rgba(255,90,60,0.6);
    }

    .nav-btn.next-btn:hover {
      background: rgba(255,90,60,1);
    }

    /* ── Hotspot de puerta (override Pannellum) ── */
    .pnlm-hotspot.door-hotspot {
      width: 48px !important;
      height: 48px !important;
      background: rgba(255,90,60,0.85) !important;
      border: 3px solid white !important;
      border-radius: 50% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      animation: pulse-door 2s infinite;
      box-shadow: 0 0 0 0 rgba(255,90,60,0.4);
    }

    .pnlm-hotspot.door-hotspot:before {
      content: '→';
      color: white;
      font-size: 22px;
      font-weight: bold;
      line-height: 1;
    }

    @keyframes pulse-door {
      0%   { box-shadow: 0 0 0 0 rgba(255,90,60,0.6); }
      70%  { box-shadow: 0 0 0 14px rgba(255,90,60,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,90,60,0); }
    }

    /* ── Tooltip de hotspot ── */
    .pnlm-tooltip span {
      background: rgba(15,31,46,0.92) !important;
      border-radius: 10px !important;
      color: white !important;
      font-family: -apple-system, 'Segoe UI', sans-serif !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      padding: 6px 14px !important;
    }

    /* ── Ocultar controles default de pannellum ── */
    .pnlm-controls-container { display: none !important; }
    .pnlm-load-box { background: #0F1F2E !important; }
    .pnlm-lbar { background: #FF5A3C !important; }
    .pnlm-lbar-fill { background: #FF5A3C !important; }

    /* ── Transición de escena ── */
    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #0F1F2E;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.35s ease;
    }
    #fade-overlay.fading { opacity: 1; }
  </style>
</head>
<body>

<div id="panorama"></div>
<div id="fade-overlay"></div>

<!-- HUD -->
<div id="hud">
  <div id="scene-info">
    <div id="scene-icon">🚪</div>
    <div>
      <div id="scene-label">Entrada Principal</div>
      <div id="scene-sublabel">Toca → para avanzar</div>
    </div>
  </div>
  <div id="kaza-badge">● KAZA 360°</div>
</div>

<!-- Nav inferior -->
<div id="nav-bar">
  <div id="scene-thumbnails"></div>
  <div id="nav-buttons">
    <button class="nav-btn prev-btn" id="btn-prev" onclick="goScene(-1)" disabled>
      ← Anterior
    </button>
    <button class="nav-btn next-btn" id="btn-next" onclick="goScene(1)">
      Siguiente →
    </button>
  </div>
</div>

<script>
  // ── CONFIGURACIÓN DE ESCENAS ──────────────────────────────────────────────
  // En Flutter Web los assets definidos en pubspec se copian en 'assets/assets/...'
  const BASE = 'assets/assets/images/';

  const scenes = [
    {
      id: 'escena1',
      title: 'Entrada Principal',
      subtitle: 'Escalera & Hall',
      icon: '🏠',
      image: BASE + '1.jpeg',
      hotspots: [
        { pitch: -5, yaw: 10,  text: 'Ir a la Cocina →', target: 1 },
      ],
    },
    {
      id: 'escena2',
      title: 'Cocina & Comedor',
      subtitle: 'Área gourmet',
      icon: '🍳',
      image: BASE + '2.jpeg',
      hotspots: [
        { pitch: -8, yaw: 170, text: '← Volver a Entrada', target: 0 },
        { pitch: -5, yaw: -30, text: 'Ir al Salón →', target: 2 },
      ],
    },
    {
      id: 'escena3',
      title: 'Salón Principal',
      subtitle: 'Sala de estar',
      icon: '🛋️',
      image: BASE + '3.jpeg',
      hotspots: [
        { pitch: -6, yaw: 170, text: '← Volver a Cocina', target: 1 },
        { pitch: -5, yaw: 10,  text: 'Ir al Pasillo →',  target: 3 },
      ],
    },
    {
      id: 'escena4',
      title: 'Pasillo & Dormitorios',
      subtitle: 'Acceso privado',
      icon: '🚪',
      image: BASE + '4.jpeg',
      hotspots: [
        { pitch: -8, yaw: 170, text: '← Volver al Salón', target: 2 },
        { pitch: -5, yaw: 0,   text: 'Ir al Dormitorio →', target: 4 },
      ],
    },
    {
      id: 'escena5',
      title: 'Dormitorio Principal',
      subtitle: 'Suite & closet',
      icon: '🛏️',
      image: BASE + '5.jpeg',
      hotspots: [
        { pitch: -6, yaw: 170, text: '← Volver al Pasillo', target: 3 },
      ],
    },
  ];

  // ── ESTADO ────────────────────────────────────────────────────────────────
  let currentScene = 0;
  let viewer = null;
  let transitioning = false;

  // ── PANNELLUM CONFIG ──────────────────────────────────────────────────────
  function buildPannellumConfig(sceneIdx) {
    const s = scenes[sceneIdx];
    const hs = s.hotspots.map(h => ({
      pitch: h.pitch,
      yaw: h.yaw,
      type: 'custom',
      text: h.text,
      cssClass: 'door-hotspot',
      clickHandlerFunc: () => navigateTo(h.target),
    }));

    return {
      default: { firstScene: s.id, autoLoad: true },
      scenes: {
        [s.id]: {
          type: 'equirectangular',
          panorama: s.image,
          hotSpots: hs,
          autoLoad: true,
          friction: 0.1,
          hfov: 100,
        }
      }
    };
  }

  // ── INICIALIZAR ───────────────────────────────────────────────────────────
  function init() {
    buildThumbnails();
    loadScene(0);
  }

  function buildThumbnails() {
    const container = document.getElementById('scene-thumbnails');
    scenes.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'thumb' + (i === 0 ? ' active' : '');
      div.id = 'thumb-' + i;
      div.innerHTML = `<div class="thumb-dot"></div><div class="thumb-name">${s.icon} ${s.title.split(' ')[0]}</div>`;
      div.onclick = () => navigateTo(i);
      container.appendChild(div);
    });
  }

  function updateHUD(idx) {
    const s = scenes[idx];
    document.getElementById('scene-label').textContent = s.title;
    document.getElementById('scene-sublabel').textContent = s.subtitle;
    document.getElementById('scene-icon').textContent = s.icon;
    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === scenes.length - 1;

    document.querySelectorAll('.thumb').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });
  }

  function loadScene(idx) {
    currentScene = idx;
    updateHUD(idx);

    const config = buildPannellumConfig(idx);
    if (viewer) {
      viewer.destroy();
    }

    viewer = pannellum.viewer('panorama', {
      ...config.default,
      ...config.scenes[scenes[idx].id],
      type: 'equirectangular',
      panorama: scenes[idx].image,
      hotSpots: config.scenes[scenes[idx].id].hotSpots,
      autoLoad: true,
      friction: 0.15,
      hfov: 100,
      minHfov: 40,
      maxHfov: 140,
      showControls: false,
      compass: false,
      showFullscreenCtrl: false,
    });
  }

  function navigateTo(idx) {
    if (transitioning || idx < 0 || idx >= scenes.length || idx === currentScene) return;
    transitioning = true;

    const overlay = document.getElementById('fade-overlay');
    overlay.classList.add('fading');

    setTimeout(() => {
      loadScene(idx);
      setTimeout(() => {
        overlay.classList.remove('fading');
        transitioning = false;
      }, 300);
    }, 350);
  }

  function goScene(delta) {
    navigateTo(currentScene + delta);
  }

  // Iniciar
  init();
</script>
</body>
</html>
