<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KAZA · Recorrido 3D</title>
<style>
  :root{--coral:#ff5a3c;--navy:#0f1f2e;--glass:rgba(15,31,46,.55);--line:rgba(255,255,255,.16)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070d;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c:active{cursor:grabbing}
  .pill{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px}
  #top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
  #room{padding:9px 16px;font-weight:700;font-size:13px;letter-spacing:.2px;display:flex;gap:8px;align-items:center}
  #room i{width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 10px var(--coral)}
  #mini{padding:6px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #mini canvas{display:block;width:126px;height:112px}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(0,0,0,.25);pointer-events:none;transition:.15s}
  #cross.hot{width:14px;height:14px;margin:-7px;background:transparent;border:2px solid var(--coral);box-shadow:0 0 12px var(--coral)}
  #prompt{position:fixed;left:50%;top:calc(50% + 28px);transform:translateX(-50%);padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
  #prompt.on{opacity:1}
  #prompt kbd{background:var(--coral);border-radius:6px;padding:1px 7px;margin-right:8px;font:inherit;font-size:12px}
  #bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;max-width:calc(100% - 20px);overflow-x:auto}
  #bar button{border:0;background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;opacity:.75;transition:.2s}
  #bar button.act{background:var(--coral);opacity:1;box-shadow:0 4px 16px rgba(255,90,60,.45)}
  #bar button:hover{opacity:1}
  #bar .sep{width:1px;background:var(--line);margin:4px 2px}
  #joy{position:fixed;left:22px;bottom:84px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);display:none;touch-action:none}
  #knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.5)}
  @media (pointer:coarse){#joy{display:block}#mini canvas{width:100px;height:90px}#bar{bottom:max(10px,env(safe-area-inset-bottom))}}
  #intro{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(15,31,46,.78),rgba(5,7,13,.95));display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;z-index:10;transition:opacity .5s}
  #intro.hide{opacity:0;pointer-events:none}
  #intro h1{font-size:30px;margin:0 0 6px;letter-spacing:-.5px}
  #intro h1 b{color:var(--coral)}
  #intro p{margin:6px 0;color:#c8d3de;font-size:14px;max-width:380px;line-height:1.5}
  #intro .keys{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:20px 0;font-size:12px;color:#9fb0c0}
  #intro .keys div{padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}
  #intro .keys strong{display:block;color:#fff;font-size:13px;margin-bottom:2px}
  #go{margin-top:6px;background:var(--coral);color:#fff;border:0;border-radius:999px;padding:14px 34px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 28px rgba(255,90,60,.5)}
  #go[disabled]{opacity:.5;cursor:wait}
  #badge{position:fixed;right:14px;bottom:78px;font-size:10px;font-weight:800;letter-spacing:.6px;color:rgba(255,255,255,.55);pointer-events:none}
  @media (pointer:coarse){#badge{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>

<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="room" class="pill"><i></i><span id="roomName">Recibidor</span></div>
  <div id="mini"><canvas id="mapc" width="252" height="224"></canvas></div>
</div>
<div id="cross"></div>
<div id="prompt" class="pill"></div>
<div id="badge">KAZA · DEMO 3D</div>
<div id="joy"><div id="knob"></div></div>

<div id="bar" class="pill">
  <button data-mode="day">☀ Día</button>
  <button data-mode="sunset" class="act">🌇 Atardecer</button>
  <button data-mode="night">🌙 Noche</button>
  <span class="sep"></span>
  <button id="btnLights">💡 Luces</button>
  <button id="btnTv">📺 TV</button>
  <button id="btnHelp">?</button>
</div>

<div id="intro">
  <h1>KAZA <b>3D</b></h1>
  <p>Recorre el departamento como si estuvieras ahí: abre puertas, prende la TV y las luces, y mira cómo cambia el atardecer.</p>
  <div class="keys">
    <div><strong>Moverse</strong>W A S D / flechas<br>o joystick</div>
    <div><strong>Mirar</strong>arrastra el mouse<br>o el dedo</div>
    <div><strong>Interactuar</strong>clic / toque<br>o tecla E</div>
  </div>
  <button id="go" disabled>Cargando…</button>
</div>

<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ───────────────────────── Renderer / escena ───────────────────────── */
const coarse = matchMedia('(pointer: coarse)').matches;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, coarse ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 4000);
camera.rotation.order = 'YXZ';

let composer = null;
if (!coarse) {
  const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {type: THREE.HalfFloatType, samples: 4});
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.5, 1.6));
  composer.addPass(new OutputPass());
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer?.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1 ? 82 : 70;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ───────────────────────── Helpers ───────────────────────── */
const world = new THREE.Group(); scene.add(world);
const outer = new THREE.Group(); scene.add(outer);
const colliders = [];
const H = 2.7, T = 0.15;
const noRay = () => {};

const mat = (color, r = .8, m = 0, extra = {}) => new THREE.MeshStandardMaterial({color, roughness: r, metalness: m, ...extra});
const bx = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const rb = (w, h, d, r = .03) => new RoundedBoxGeometry(w, h, d, 3, r);
function add(parent, geo, material, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = !o.noCast; m.receiveShadow = !o.noRecv;
  if (o.rx) m.rotation.x = o.rx; if (o.ry) m.rotation.y = o.ry; if (o.rz) m.rotation.z = o.rz;
  parent.add(m); return m;
}
function collide(x0, x1, z0, z1, kind = 'furn', on = null) {
  const c = {x0, x1, z0, z1, kind, on}; colliders.push(c); return c;
}
const rnd = (a, b) => a + Math.random() * (b - a);
let seed = 7; const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}

/* ───────────────────────── Texturas procedurales ───────────────────────── */
function woodTexture(base) {
  return canvasTex(1024, 1024, (g) => {
    const planks = 12, pw = 1024 / planks, bc = new THREE.Color(base);
    for (let i = 0; i < planks; i++) {
      let y = -srand() * 500;
      while (y < 1024) {
        const len = 480 + srand() * 520, k = .86 + srand() * .24;
        const c = bc.clone().multiplyScalar(k);
        g.fillStyle = '#' + c.getHexString();
        g.fillRect(i * pw, y, pw, len);
        for (let j = 0; j < 16; j++) {
          g.strokeStyle = `rgba(70,40,18,${.03 + srand() * .07})`; g.lineWidth = 1 + srand() * 1.6;
          const gx = i * pw + srand() * pw;
          g.beginPath(); g.moveTo(gx, y);
          g.bezierCurveTo(gx + srand() * 8 - 4, y + len * .3, gx + srand() * 8 - 4, y + len * .65, gx + srand() * 4 - 2, y + len);
          g.stroke();
        }
        g.fillStyle = 'rgba(25,14,6,.55)'; g.fillRect(i * pw, y, pw, 2);
        y += len;
      }
      g.fillStyle = 'rgba(25,14,6,.5)'; g.fillRect(i * pw, 0, 2, 1024);
    }
  }, null);
}
function tileTexture() {
  return canvasTex(1024, 1024, (g) => {
    g.fillStyle = '#7d8286'; g.fillRect(0, 0, 1024, 1024);
    const n = 4, s = 1024 / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const v = 205 + srand() * 22;
      g.fillStyle = `rgb(${v},${v + 1},${v + 3})`;
      g.fillRect(i * s + 3, j * s + 3, s - 6, s - 6);
      for (let k = 0; k < 40; k++) {
        g.fillStyle = `rgba(120,125,130,${srand() * .06})`;
        g.fillRect(i * s + srand() * s, j * s + srand() * s, 30 + srand() * 90, 2 + srand() * 6);
      }
    }
  }, null);
}
function rugTexture() {
  return canvasTex(512, 640, (g, w, h) => {
    g.fillStyle = '#d9cdb9'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#2f3b44'; g.lineWidth = 10; g.strokeRect(22, 22, w - 44, h - 44);
    g.strokeStyle = '#b58d62'; g.lineWidth = 5; g.strokeRect(46, 46, w - 92, h - 92);
    for (let i = 0; i < 9; i++) {
      g.fillStyle = i % 2 ? '#c9bba3' : '#e6dccb';
      g.beginPath(); g.arc(w / 2, h / 2, 140 - i * 15, 0, 7); g.globalAlpha = .55; g.fill(); g.globalAlpha = 1;
    }
    for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(0,0,0,${srand() * .06})`; g.fillRect(srand() * w, srand() * h, 2, 2); }
  }, null);
}
function artTexture(pal, bg) {
  return canvasTex(512, 384, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 7; i++) {
      const gr = g.createLinearGradient(srand() * w, 0, srand() * w, h);
      gr.addColorStop(0, pal[i % pal.length]); gr.addColorStop(1, pal[(i + 2) % pal.length]);
      g.fillStyle = gr; g.globalAlpha = .8;
      g.beginPath(); g.ellipse(srand() * w, srand() * h, 60 + srand() * 140, 40 + srand() * 100, srand() * 3, 0, 7); g.fill();
    }
    g.globalAlpha = 1;
  }, null);
}
function buildingTextures() {
  const cells = []; for (let i = 0; i < 16 * 16; i++) cells.push(srand());
  const mk = (night) => canvasTex(256, 256, (g) => {
    g.fillStyle = night ? '#000' : '#8c97a3'; g.fillRect(0, 0, 256, 256);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const r = cells[y * 16 + x];
      if (night) { if (r > .68) { g.fillStyle = r > .8 ? '#ffd9a0' : '#cfe3ff'; g.fillRect(x * 16 + 3, y * 16 + 3, 10, 9); } }
      else { g.fillStyle = r > .55 ? '#3d5368' : '#2c3b4a'; g.fillRect(x * 16 + 3, y * 16 + 3, 10, 9); }
    }
  }, [1, 1]);
  const a = mk(false), b = mk(true);
  a.wrapS = a.wrapT = b.wrapS = b.wrapT = THREE.RepeatWrapping;
  return {day: a, night: b};
}

/* ───────────────────────── Materiales ───────────────────────── */
const floorTex = woodTexture('#bf9462'); floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(10 / 2.4, 8 / 2.4);
const floorMat = mat(0xffffff, .5, 0, {map: floorTex});
const deckTex = woodTexture('#8a6a4a'); deckTex.wrapS = deckTex.wrapT = THREE.RepeatWrapping; deckTex.repeat.set(7 / 2.4, 2.2 / 2.4);
const deckMat = mat(0xffffff, .75, 0, {map: deckTex});
const tileTex = tileTexture(); tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;
const wallMat = mat('#f3efe8', .95);
const ceilMat = mat('#fbfaf7', .95);
const frameMat = mat('#1d2126', .45, .6);
const glassMat = new THREE.MeshPhysicalMaterial({color: 0xcfe6f5, roughness: .03, metalness: 0, transparent: true, opacity: .13, depthWrite: false, side: THREE.DoubleSide});
const oak = mat('#c8a273', .55);
const walnut = mat('#6a4730', .5);
const chrome = mat('#d7dbde', .15, 1);
const black = mat('#15171a', .5, .4);
const white = mat('#f4f4f2', .35);

/* ───────────────────────── Estructura ───────────────────────── */
function addWall(axis, fixed, s0, s1, openings = []) {
  const segs = []; let cur = s0;
  openings.sort((p, q) => p.a - q.a);
  for (const o of openings) {
    if (o.a > cur) segs.push({a: cur, b: o.a, y0: 0, y1: H, col: true});
    if (o.y1 < H) segs.push({a: o.a, b: o.b, y0: o.y1, y1: H, col: false});
    if (o.y0 > 0) segs.push({a: o.a, b: o.b, y0: 0, y1: o.y0, col: true});
    cur = o.b;
  }
  if (s1 > cur) segs.push({a: cur, b: s1, y0: 0, y1: H, col: true});
  for (const s of segs) {
    const len = s.b - s.a, h = s.y1 - s.y0, cy = (s.y0 + s.y1) / 2, cm = (s.a + s.b) / 2;
    if (axis === 'x') { add(world, bx(len, h, T), wallMat, cm, cy, fixed); if (s.col) collide(s.a, s.b, fixed - T / 2, fixed + T / 2, 'wall'); }
    else { add(world, bx(T, h, len), wallMat, fixed, cy, cm); if (s.col) collide(fixed - T / 2, fixed + T / 2, s.a, s.b, 'wall'); }
  }
}
function casing(axis, fixed, a, b, y0, y1, w = .05) {
  // marco perimetral que sobresale a ambos lados del muro
  const d = T + .03, m = frameMat;
  if (axis === 'x') {
    add(world, bx(b - a + w * 2, w, d), m, (a + b) / 2, y1 + w / 2, fixed, {noCast: true});
    add(world, bx(w, y1 - y0, d), m, a - w / 2, (y0 + y1) / 2, fixed, {noCast: true});
    add(world, bx(w, y1 - y0, d), m, b + w / 2, (y0 + y1) / 2, fixed, {noCast: true});
    if (y0 > 0) add(world, bx(b - a + w * 2, w, d), m, (a + b) / 2, y0 - w / 2, fixed, {noCast: true});
  } else {
    add(world, bx(d, w, b - a + w * 2), m, fixed, y1 + w / 2, (a + b) / 2, {noCast: true});
    add(world, bx(d, y1 - y0, w), m, fixed, (y0 + y1) / 2, a - w / 2, {noCast: true});
    add(world, bx(d, y1 - y0, w), m, fixed, (y0 + y1) / 2, b + w / 2, {noCast: true});
    if (y0 > 0) add(world, bx(d, w, b - a + w * 2), m, fixed, y0 - w / 2, (a + b) / 2, {noCast: true});
  }
}
function addWindow(axis, fixed, a, b, y0, y1, frosted = false) {
  const o = {a, b, y0, y1};
  casing(axis, fixed, a, b, y0, y1);
  const gm = frosted ? new THREE.MeshPhysicalMaterial({color: 0xe8f1f5, roughness: .6, transparent: true, opacity: .75, depthWrite: false}) : glassMat;
  const g = axis === 'x' ? add(world, bx(b - a, y1 - y0, .02), gm, (a + b) / 2, (y0 + y1) / 2, fixed, {noCast: true})
                         : add(world, bx(.02, y1 - y0, b - a), gm, fixed, (y0 + y1) / 2, (a + b) / 2, {noCast: true});
  g.raycast = noRay;
  // cruceta central
  if (axis === 'x') add(world, bx(.035, y1 - y0, .05), frameMat, (a + b) / 2, (y0 + y1) / 2, fixed, {noCast: true});
  else add(world, bx(.05, y1 - y0, .035), frameMat, fixed, (y0 + y1) / 2, (a + b) / 2, {noCast: true});
  if (axis === 'x') collide(a, b, fixed - T / 2, fixed + T / 2, 'wall'); else collide(fixed - T / 2, fixed + T / 2, a, b, 'wall');
  return o;
}

// Piso, techo y volumen exterior
const floor = add(world, new THREE.PlaneGeometry(10.15, 8.15), floorMat, 5, 0, 4, {rx: -Math.PI / 2, noCast: true});
add(world, bx(10.15, .3, 8.15), mat('#d8d4cc', .9), 5, -.16, 4, {noCast: true});
add(world, bx(10.15, .3, 8.15), ceilMat, 5, H + .15, 4);
const bathTile = mat(0xffffff, .22, 0, {map: tileTex});
tileTex.repeat.set(3.4 / 2.4, 3.4 / 2.4);
add(world, new THREE.PlaneGeometry(3.4, 3.4), bathTile, 8.25, .004, 6.2, {rx: -Math.PI / 2, noCast: true});
// balcón
add(world, new THREE.PlaneGeometry(6.65, 2.1), deckMat, 3.25, .002, 9.05, {rx: -Math.PI / 2, noCast: true});
add(world, bx(6.65, .3, 2.1), mat('#d8d4cc', .9), 3.25, -.16, 9.05);
// tira de ladrillo exterior bajo el edificio
add(outer, bx(10.3, 40, 10.3), mat('#c9c6c0', .9), 5, -20.4, 5.0);

// Muros exteriores e interiores
addWall('x', 0, -T / 2, 10 + T / 2, [{a: 5.0, b: 6.3, y0: 1.0, y1: 2.1}]);            // norte
addWall('x', 8, -T / 2, 10 + T / 2, [{a: .5, b: 6.0, y0: 0, y1: 2.6}, {a: 8.8, b: 9.8, y0: 1.5, y1: 2.2}]); // sur
addWall('z', 0, 0, 8, [{a: 5.5, b: 6.5, y0: 0, y1: 2.2}, {a: .6, b: 2.0, y0: 1.0, y1: 2.1}]);              // oeste
addWall('z', 10, 0, 8, [{a: 1.2, b: 3.6, y0: .35, y1: 2.45}, {a: 6.1, b: 6.9, y0: 1.5, y1: 2.2}]);         // este
addWall('z', 6.5, 0, 8, [{a: 2.1, b: 3.0, y0: 0, y1: 2.1}, {a: 5.9, b: 6.8, y0: 0, y1: 2.1}]);             // tabique sala | habitaciones
addWall('x', 4.5, 6.5, 10 + T / 2);                                                                          // tabique dormitorio | baño

addWindow('x', 0, 5.0, 6.3, 1.0, 2.1);
addWindow('z', 0, .6, 2.0, 1.0, 2.1);
addWindow('z', 10, 1.2, 3.6, .35, 2.45);
addWindow('z', 10, 6.1, 6.9, 1.5, 2.2, true);
addWindow('x', 8, 8.8, 9.8, 1.5, 2.2, true);

/* ───────────────────────── Puertas ───────────────────────── */
const ease = (t) => t * t * (3 - 2 * t);
const interactables = [];
function makeInteractive(obj, label, fn) {
  obj.traverse((o) => { if (o.isMesh) o.userData.act = {label, fn}; });
  interactables.push(obj);
}
const doors = [];
function makeDoor({hinge, w, h, closed, open, axis, fixed, a, b, material, glassInsert}) {
  casing(axis, fixed, a, b, 0, h);
  const g = new THREE.Group(); g.position.set(hinge[0], 0, hinge[1]); world.add(g);
  const cA = Math.atan2(-closed[1], closed[0]);
  let oA = Math.atan2(-open[1], open[0]);
  let d = oA - cA; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  oA = cA + d;
  add(g, bx(w - .02, h - .01, .045), material, w / 2, h / 2, 0);

function railing(x0, z0, x1, z1) {

  add(g, bx(len, .12, .05), chrome, 0, .09, 0, {noCast: true});

  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform vec3 uHor,uZen,uSun,uSunCol; uniform float uNight,uDisc; varying vec3 vP;
    float h(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453); }
    void main(){

      float s = max(dot(d,normalize(uSun)),0.);
      col += uSunCol * (pow(s,6.)*.35 + pow(s,64.)*.6);
      col += uSunCol * smoothstep(.9992,.9998,s) * uDisc;
      vec3 q = floor(d*260.); float st = step(.9965, h(q));
      col += vec3(st) * uNight * smoothstep(.03,.25,d.y) * 1.4;

  fragmentShader: `

    void main(){

function setMode(m, instant = false) {

function stepEnv(dt) {
  const k = 1 - Math.exp(-dt * 2.2), L = (a, b) => a + (b - a) * k;
  cur.sunDir.lerp(target.sunDir, k).normalize();
  for (const key of ['sunCol', 'hemiSky', 'hemiGnd', 'hor', 'zen', 'sea', 'discCol']) cur[key].lerp(target[key], k);
  for (const key of ['sunInt', 'hemiInt', 'env', 'night', 'expo', 'disc', 'fill']) cur[key] = L(cur[key], target[key]);
  sunDirW.copy(cur.sunDir);
  sun.position.copy(sun.target.position).addScaledVector(cur.sunDir, 40);
  sun.color.copy(cur.sunCol); sun.intensity = cur.sunInt;
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGnd); hemi.intensity = cur.hemiInt;
  scene.environmentIntensity = cur.env;
  renderer.toneMappingExposure = cur.expo;
  skyMat.uniforms.uHor.value.copy(cur.hor); skyMat.uniforms.uZen.value.copy(cur.zen);
  skyMat.uniforms.uSunCol.value.copy(cur.discCol); skyMat.uniforms.uNight.value = cur.night; skyMat.uniforms.uDisc.value = cur.disc;
  seaMat.uniforms.uDeep.value.copy(cur.sea); seaMat.uniforms.uHor.value.copy(cur.hor);
  seaMat.uniforms.uSunCol.value.copy(cur.discCol); seaMat.uniforms.uNight.value = cur.night;
  bldMat.emissiveIntensity = cur.night * 1.1 + (1 - cur.night) * (target === PRESETS.sunset ? .25 : 0);
  bldMat.color.setScalar(1 - cur.night * .75);
  const f = cur.fill;
  fills.forEach((l) => { l.intensity = l.userData.base * f; });
}

function toggleZone(z) { z.target = z.target ? 0 : 1; syncLightsBtn(); }
function syncLightsBtn() { document.getElementById('btnLights').classList.toggle('act', zones.some((z) => z.target)); }
function updateZones(dt) {
  for (const z of zones) {
    z.level += (z.target - z.level) * (1 - Math.exp(-dt * 7));
    for (const l of z.lights) l.intensity = l.userData.base * z.level;
    for (const m of z.bulbs) m.color.copy(bulbOff).lerp(bulbOn, z.level);
    if (z.shade) z.shade.emissive?.setRGB(.9 * z.level, .55 * z.level, .25 * z.level);
  }
  tv.level += ((tv.on ? 1 : 0) - tv.level) * (1 - Math.exp(-dt * 6));
  tvLight.intensity = 2.2 * tv.level;
}

  const r = joyEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = (e.clientX - cx) / 44, dy = (e.clientY - cy) / 44; const m = Math.hypot(dx, dy);

const drag = {id: null, x: 0, y: 0, sx: 0, sy: 0, t: 0, moved: 0};
canvas.addEventListener('pointerdown', (e) => {
  if (drag.id !== null) return;
  drag.id = e.pointerId; drag.x = drag.sx = e.clientX; drag.y = drag.sy = e.clientY; drag.t = performance.now(); drag.moved = 0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  const s = e.pointerType === 'touch' ? .0052 : .0033;
  player.yaw -= dx * s; player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - dy * s));
});
const endDrag = (e) => {
  if (e.pointerId !== drag.id) return;
  drag.id = null;
  if (drag.moved < 9 && performance.now() - drag.t < 450) interactAt(e);
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', () => { drag.id = null; });

const ray = new THREE.Raycaster();
function pick(ndc, maxD) {
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(world.children, true);
  for (const h of hits) {
    if (h.object.isLight || h.object.userData.noPick) continue;
    if (h.distance > maxD) return null;
    return h.object.userData.act ? h : null;
  }
  return null;
}
function interactAt(e) {
  const ndc = e ? new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1) : new THREE.Vector2(0, 0);
  const hit = pick(ndc, coarse ? 4.2 : 3.6);
  if (hit) hit.object.userData.act.fn();
}

/* colisiones */
function blocked(x, z) {
  for (const c of colliders) {
    if (c.on && !c.on()) continue;
    const nx = Math.max(c.x0, Math.min(x, c.x1)), nz = Math.max(c.z0, Math.min(z, c.z1));
    if ((x - nx) ** 2 + (z - nz) ** 2 < player.r ** 2) return true;
  }
  return false;
}

const mapc = document.getElementById('mapc'), mg = mapc.getContext('2d');
const MS = 21, MX = 14, MZ = 12;
function drawMap() {
  mg.clearRect(0, 0, mapc.width, mapc.height);
  mg.fillStyle = 'rgba(255,255,255,.1)'; mg.fillRect(MX, MZ, 10 * MS, 8 * MS);
  mg.fillStyle = 'rgba(255,255,255,.06)'; mg.fillRect(MX, MZ + 8 * MS, 6.5 * MS, 2 * MS);
  for (const c of colliders) {
    if (c.kind === 'furn') mg.fillStyle = 'rgba(255,255,255,.22)';
    else if (c.kind === 'door') mg.fillStyle = (c.on && c.on()) ? '#ff5a3c' : 'rgba(255,90,60,.25)';
    else mg.fillStyle = 'rgba(255,255,255,.85)';
    mg.fillRect(MX + c.x0 * MS, MZ + c.z0 * MS, Math.max(2, (c.x1 - c.x0) * MS), Math.max(2, (c.z1 - c.z0) * MS));
  }
  const px = MX + player.x * MS, pz = MZ + player.z * MS;
  mg.save(); mg.translate(px, pz); mg.rotate(-player.yaw);
  const gr = mg.createRadialGradient(0, 0, 0, 0, 0, 50); gr.addColorStop(0, 'rgba(255,90,60,.55)'); gr.addColorStop(1, 'rgba(255,90,60,0)');
  mg.fillStyle = gr; mg.beginPath(); mg.moveTo(0, 0); mg.arc(0, 0, 50, -Math.PI / 2 - .6, -Math.PI / 2 + .6); mg.closePath(); mg.fill();
  mg.fillStyle = '#fff'; mg.beginPath(); mg.arc(0, 0, 4.5, 0, 7); mg.fill();
  mg.strokeStyle = '#ff5a3c'; mg.lineWidth = 2; mg.stroke(); mg.restore();
}
const roomEl = document.getElementById('roomName'); let lastRoom = '';
function roomName() {
  const {x, z} = player;
  if (z > 8) return 'Balcón';
  if (x > 6.5) return z < 4.5 ? 'Dormitorio' : 'Baño';
  if (x < 1.6 && z > 5) return 'Recibidor';
  if (z < 2.9 && x < 4.8) return 'Cocina';
  if (x > 3.9 && z > 5.6) return 'Comedor';
  return 'Sala';
}

/* ───────────────────────── Bucle ───────────────────────── */
const clock = new THREE.Clock();
const promptEl = document.getElementById('prompt'), crossEl = document.getElementById('cross');
let frame = 0, started = false;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime; frame++;
  if (started) {
    let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
    let iz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
    const m = Math.hypot(ix, iz); if (m > 1) { ix /= m; iz /= m; }
    const sp = (keys.ShiftLeft || keys.ShiftRight ? 3.0 : 1.7);
    const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw), rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
    const tvx = (fx * iz + rx * ix) * sp, tvz = (fz * iz + rz * ix) * sp, a = 1 - Math.exp(-dt * 10);
    player.vx += (tvx - player.vx) * a; player.vz += (tvz - player.vz) * a;
    const nx = player.x + player.vx * dt, nz = player.z + player.vz * dt;
    if (!blocked(nx, player.z)) player.x = nx; else player.vx = 0;
    if (!blocked(player.x, nz)) player.z = nz; else player.vz = 0;
    player.bob += Math.hypot(player.vx, player.vz) * dt * 5.2;
  }
  const spd = Math.hypot(player.vx, player.vz);
  camera.position.set(player.x, 1.62 + Math.sin(player.bob) * .014 * Math.min(spd, 2), player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  for (const d of doors) {
    d.t += (d.target - d.t) * (1 - Math.exp(-dt * 6)); if (Math.abs(d.target - d.t) < .002) d.t = d.target;
    d.g.rotation.y = d.cA + (d.oA - d.cA) * ease(d.t);
  }
  slider.t += (slider.target - slider.t) * (1 - Math.exp(-dt * 4.5)); if (Math.abs(slider.target - slider.t) < .002) slider.t = slider.target;
  slidePane.g.position.x = 4.625 - 2.68 * ease(slider.t);

  stepEnv(dt); updateZones(dt);
  if (tv.on && frame % 2 === 0) drawTv(t);
  seaMat.uniforms.uT.value = t;

  if (frame % 3 === 0) {
    drawMap();
    const r = roomName(); if (r !== lastRoom) { roomEl.textContent = r; lastRoom = r; }
    if (!coarse && started) {
      const hit = pick(new THREE.Vector2(0, 0), 3.6);
      crossEl.classList.toggle('hot', !!hit);
      if (hit) { const a = hit.object.userData.act; promptEl.innerHTML = `<kbd>E</kbd>${a.label}`; promptEl.classList.add('on'); }
      else promptEl.classList.remove('on');
    }
  }
  if (composer) composer.render(); else renderer.render(scene, camera);
}

/* ───────────────────────── Inicio ───────────────────────── */
const intro = document.getElementById('intro'), goBtn = document.getElementById('go');
const qs = new URLSearchParams(location.search);
setMode(PRESETS[qs.get('mode')] ? qs.get('mode') : 'sunset', true);
if (qs.get('tv') === '1') setTv(true);
zones.forEach((z) => z.level = z.target);
drawTv(0);
goBtn.disabled = false; goBtn.textContent = 'Entrar al departamento';
goBtn.addEventListener('click', () => { intro.classList.add('hide'); started = true; });
if (qs.get('autostart') === '1') { intro.classList.add('hide'); started = true; }
window.__kaza = {player, setMode, setTv, doors, slider, zones, THREE, scene, world};
loop();
</script>
